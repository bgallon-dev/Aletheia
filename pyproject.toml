[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aletheia"
version = "0.1.0"
description = "Content-addressed storage with forensic barcode verification"
readme = "README.md"
requires-python = ">=3.9"

[project.optional-dependencies]
crypto = ["cryptography>=41,<45"]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<6",
    "ruff>=0.4,<1",
    "mypy>=1.10,<2",
    "pre-commit>=3.7,<4",
    "pip-audit>=2.7,<3",
    "bandit>=1.7,<2",
    "cryptography>=41,<45",
]

[project.scripts]
aletheia = "aletheia.cli:main"

[tool.setuptools.packages.find]
include = ["aletheia*"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
strict = false
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
markers = [
    "slow: marks tests as slow resource tests (deselect with '-m not slow')",
    "requires_binary: marks tests requiring the compiled Odin entropy binary",
]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]
